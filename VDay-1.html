<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Be My Valentine 💘</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(-45deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
font-family:"Poppins",sans-serif;
overflow:hidden;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:min(92%,430px);
padding:40px 30px 45px;
background:rgba(255,255,255,0.8);
backdrop-filter:blur(18px);
border-radius:28px;
text-align:center;
box-shadow:0 30px 80px rgba(0,0,0,0.25);
position:relative;
}

.card::before{
content:"";
position:absolute;
inset:-2px;
border-radius:30px;
background:linear-gradient(120deg,#ff4d6d,#ff9a9e,#fbc2eb);
z-index:-1;
filter:blur(20px);
opacity:.7;
}

.emoji{
font-size:60px;
margin-bottom:10px;
animation:heartbeat 1.6s infinite;
}

@keyframes heartbeat{
0%,100%{transform:scale(1);}
50%{transform:scale(1.12);}
}

h2{
font-family:"Playfair Display",serif;
font-size:27px;
color:#4a1c2f;
margin-bottom:15px;
}

.puppies{
font-size:28px;
margin-bottom:18px;
animation:bounce 2s infinite;
}

@keyframes bounce{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-6px);}
}

.buttons{
position:relative;
height:78px;
}

button{
position:absolute;
padding:14px 36px;
border-radius:40px;
border:none;
font-size:16px;
cursor:pointer;
transition:.25s;
}

#yes{
left:12%;
background:linear-gradient(135deg,#ff4d6d,#ff758f);
color:#fff;
box-shadow:0 15px 35px rgba(255,77,109,.55);
}

#no{
left:55%;
background:white;
color:#777;
}

.hint{
margin-top:25px;
font-size:13px;
color:#6b6b6b;
font-style:italic;
}

/* floating hearts + chocolates */
.float{
position:absolute;
bottom:-20px;
animation:floatUp linear forwards;
pointer-events:none;
}

@keyframes floatUp{
from{transform:translateY(0);opacity:1;}
to{transform:translateY(-120vh);opacity:0;}
}
</style>
</head>

<body>

<div class="card">
<div class="emoji">🐶❤️🐩🍫</div>

<h2>MONU, LODU, PODU😘<br>will you be my Valentine?</h2>

<div class="puppies">
</div>

<div class="buttons">
<button id="yes">Yes 💖🐩</button>
<button id="no">No 🙈</button>
</div>

<div class="hint">Puppies, chocolates, and my heart are waiting for you ✨</div>
</div>

<audio id="yesSound" src="https://assets.mixkit.co/sfx/preview/mixkit-achievement-bell-600.mp3"></audio>

<script>
const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");
const card=document.querySelector(".card");
const yesSound=document.getElementById("yesSound");

noBtn.addEventListener("mouseenter",()=>{
const cardRect=card.getBoundingClientRect();
const btnRect=noBtn.getBoundingClientRect();

const maxX=cardRect.width-btnRect.width-10;
const maxY=cardRect.height-btnRect.height-10;

noBtn.style.left=Math.random()*maxX+"px";
noBtn.style.top=Math.random()*maxY+"px";
});

yesBtn.addEventListener("click",()=>{
yesSound.play();

confetti({
particleCount:300,
spread:140,
origin:{y:.65}
});

setTimeout(()=>{
alert("YAYYY ❤️🐶🐩🍫✨\nI can’t wait to cuddle puppies, share chocolates, and spend the most romantic day with you, MONU!");
},500);
});

/* hearts + chocolates + puppies floating */
function createFloat(){
const items=["❤️","💖","🍫","✨","🐶","🐩","😘"];
const el=document.createElement("div");
el.className="float";
el.innerHTML=items[Math.floor(Math.random()*items.length)];
el.style.left=Math.random()*100+"vw";
el.style.fontSize=(Math.random()*20+16)+"px";
el.style.animationDuration=(Math.random()*3+4)+"s";

document.body.appendChild(el);
setTimeout(()=>el.remove(),8000);
}

setInterval(createFloat,350);
</script>

</body>
</html>
